name: Build CreativeOS ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO using Mock
        run: |
          docker run --privileged --net=host -v ${{ github.workspace }}:/build fedora:latest bash -c "
            dnf install -y mock livecd-tools lorax && \
            useradd -m builder && \
            usermod -aG mock builder && \
            su - builder -c 'mock -r fedora-40-x86_64 --init' && \
            su - builder -c 'mock -r fedora-40-x86_64 --install livecd-tools lorax' && \
            su - builder -c 'mock -r fedora-40-x86_64 --copyin /build/creativeos.ks /creativeos.ks' && \
            su - builder -c 'mock -r fedora-40-x86_64 --shell \"livecd-creator --config=/creativeos.ks --fslabel=CreativeOS-x86_64 --cache=/var/cache/live\"' && \
            su - builder -c 'mock -r fedora-40-x86_64 --copyout /CreativeOS-x86_64.iso /build/CreativeOS-x86_64.iso'
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreativeOS-x86_64-ISO
          path: CreativeOS-x86_64.iso
